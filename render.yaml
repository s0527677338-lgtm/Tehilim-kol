services:
  - type: web
    name: tehilim
    runtime: python
    plan: free
    pythonVersion: "3.12.8"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
